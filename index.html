<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunrun Academy Analytics (Mockup)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Interactive mockup of the Sunrun Academy performance dashboard. Sample data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080b}
a{color:#f5a524}a:hover{color:#ffd27a}
.app{font-family:Inter,system-ui,sans-serif;color:#eceef2;background:#07080b;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.disp{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.01em}
.ttl{text-transform:uppercase;letter-spacing:.05em}
.glow{filter:drop-shadow(0 0 6px rgba(245,165,36,.55))}
.card{background:#0e1014;border:1px solid #1d212a;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);border-radius:16px;padding:20px;min-width:0;box-sizing:border-box}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9aa1ad;font-weight:600}
.muted{color:#9aa1ad}
.faint{color:#858c99}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:#b7bdc8;font:500 14px Inter,sans-serif;cursor:pointer;text-align:left}
.nav:hover{background:#171a21;color:#eceef2}
.nav.on{background:#14171d;color:#fff;box-shadow:inset 0 0 0 1px #262b35}
.nav .num{font:600 13px 'Barlow Condensed',sans-serif;color:#858c99;width:18px}
.nav.on .num{color:#f5a524}
.seg{display:inline-flex;background:#0e1014;border:1px solid #1d212a;border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:#aeb4bf;font:600 13px Inter,sans-serif;cursor:pointer}
.seg button:hover{color:#eceef2}
.seg button.on{background:#f5a524;color:#16120a}
.pill{min-height:40px;padding:0 14px;border:1px solid #2a303b;border-radius:999px;background:transparent;color:#c3c8d1;font:500 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.pill:hover{border-color:#4a515e;color:#fff}
.pill.on{background:#eceef2;border-color:#eceef2;color:#07080b;font-weight:600}
.ghost{min-height:40px;padding:0 14px;border:1px solid #2a303b;background:transparent;color:#c3c8d1;border-radius:10px;font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.ghost:hover{border-color:#4a515e;color:#fff}
button:focus-visible{outline:2px solid #f5a524;outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.up{color:#6fd47b;background:rgba(76,195,90,.13)}
.down{color:#ff9090;background:rgba(240,112,112,.13)}
.flat{color:#aeb4bf;background:#1c2029}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;white-space:nowrap}
.st i{width:8px;height:8px;display:inline-block;border-radius:50%}
.st.good{color:#6fd47b}.st.good i{background:#4cc35a}
.st.warn{color:#fbc54d}.st.warn i{background:#fab219;border-radius:1px;transform:rotate(45deg)}
.st.crit{color:#ff9090}.st.crit i{background:#f07070;border-radius:1px}
.st.info{color:#aeb4bf}.st.info i{background:transparent;border:2px solid #858c99;box-sizing:border-box;width:10px;height:10px}
.trow{display:grid;grid-template-columns:minmax(150px,1.5fr) repeat(9,minmax(78px,1fr)) minmax(96px,1fr);align-items:center;min-width:1100px}
.trow > div{padding:12px 10px;text-align:right;white-space:nowrap;font-size:14px;border-bottom:1px solid #1c2029}
.trow > div:first-child{text-align:left}
.trow.head > div{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9aa1ad;font-weight:600;border-bottom:1px solid #2a303b}
.trow.sel > div{background:#1a1e26}
.rowbtn{background:none;border:0;color:#eceef2;font:600 14px Inter,sans-serif;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.rowbtn:hover{color:#f5a524}
.track{position:relative;height:10px;background:#1f232c;border-radius:999px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.hcell{min-height:52px;border:0;border-radius:8px;font:600 13px Inter,sans-serif;cursor:pointer;width:100%}
.hcell:hover{outline:2px solid #eceef2;outline-offset:-2px}
.req{color:#f7c96a;background:rgba(245,184,61,.12)}
.crow{display:grid;grid-template-columns:minmax(210px,2.4fr) minmax(104px,1.1fr) repeat(3,minmax(70px,.8fr)) minmax(112px,1.1fr) minmax(52px,.6fr) minmax(120px,1fr);align-items:center;min-width:820px}
.crow > div{padding:12px 10px;text-align:right;white-space:nowrap;font-size:14px;border-bottom:1px solid #1c2029}
.crow > div:nth-child(-n+2){text-align:left}
.crow.head > div{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9aa1ad;font-weight:600;border-bottom:1px solid #2a303b}
.crow.sel > div{background:#1a1e26}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div class="app" style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch">

  <aside style="flex: 1 1 220px; box-sizing: border-box; padding: 28px 16px; background: #0a0b0e; border-right: 1px solid #1a1e26; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="7" fill="#f5a524"></circle><g stroke="#f5a524" stroke-width="2.2" stroke-linecap="round"><path d="M17 2v4"></path><path d="M17 28v4"></path><path d="M2 17h4"></path><path d="M28 17h4"></path><path d="M6.4 6.4l2.8 2.8"></path><path d="M24.8 24.8l2.8 2.8"></path><path d="M6.4 27.6l2.8-2.8"></path><path d="M24.8 9.2l2.8-2.8"></path></g></svg>
      <div>
        <div class="disp ttl" style="font-size: 20px; font-weight: 700; line-height: 1">Sunrun Academy</div>
        <div class="faint" style="font-size: 12px; margin-top: 2px">Performance analytics</div>
      </div>
    </div>
    <nav aria-label="Dashboard pages" style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{navs}}" as="n" hint-placeholder-count="4">
        <button type="button" class="{{n.cls}}" onClick="{{n.go}}" aria-current="{{n.current}}">
          <span class="num">{{n.num}}</span>
          <span style="flex: 1">{{n.label}}</span>
          <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 11px; font-weight: 700; color: #16120a; background: #f5a524; border-radius: 999px; padding: 2px 7px">{{n.badge}}</span>
          </sc-if>
        </button>
      </sc-for>
    </nav>
    <div style="margin-top: auto; padding: 14px; border: 1px solid #1f232c; border-radius: 12px; display: flex; flex-direction: column; gap: 6px">
      <div class="lbl">Data as of</div>
      <div style="font-size: 14px; font-weight: 600">Oct 28, 2026</div>
      <div class="faint" style="font-size: 12px; line-height: 1.45">Sample data for design review. Sources: CRM (SRA, CAP, Install), RunXLearning, Academy LMS.</div>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 56px; display: flex; flex-direction: column; gap: 20px">

    <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
      <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0">{{pageTitle}}</h1>
      <span class="faint" style="font-size: 13px">{{periodLabel}}</span>
      <div class="seg" role="group" aria-label="Comparison period">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
          <button type="button" class="{{m.cls}}" onClick="{{m.go}}" aria-pressed="{{m.on}}">{{m.label}}</button>
        </sc-for>
      </div>
    </header>

    <section class="card" aria-label="Scope" style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
        <span class="lbl" style="width: 64px">Channel</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{chanPills}}" as="c" hint-placeholder-count="6">
            <button type="button" class="{{c.cls}}" onClick="{{c.go}}" aria-pressed="{{c.on}}">{{c.name}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
        <span class="lbl" style="width: 64px">Region</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{regPills}}" as="c" hint-placeholder-count="6">
            <button type="button" class="{{c.cls}}" onClick="{{c.go}}" aria-pressed="{{c.on}}">{{c.name}}</button>
          </sc-for>
        </div>
      </div>
      <sc-if value="{{showOffices}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
          <span class="lbl" style="width: 64px">Office</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{offPills}}" as="c" hint-placeholder-count="3">
              <button type="button" class="{{c.cls}}" onClick="{{c.go}}" aria-pressed="{{c.on}}">{{c.name}}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{isScoped}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 4px">
          <span class="faint" style="font-size: 13px">Viewing {{scopeName}}</span>
          <button type="button" class="ghost" onClick="{{reset}}">Reset to all channels</button>
        </div>
      </sc-if>
    </section>

    <!-- ===================== 01 OVERVIEW ===================== -->
    <sc-if value="{{isOverview}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 20px">


        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
          <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
            <div class="card" style="display: flex; flex-direction: column; gap: 10px">
              <div class="lbl">{{k.label}}</div>
              <div style="display: flex; align-items: baseline; gap: 8px">
                <span class="disp" style="font-size: 52px; font-weight: 600; line-height: 1">{{k.value}}</span>
                <span class="faint" style="font-size: 13px">per rep / mo</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
                <span class="{{k.d.cls}}">{{k.d.text}}</span>
                <span class="faint" style="font-size: 12px">{{k.cmp}}</span>
              </div>
              <svg viewBox="0 0 200 40" preserveAspectRatio="none" style="width: 100%; height: 40px; overflow: visible" aria-hidden="true"><path class="glow" d="{{k.spark}}" fill="none" stroke="#f5a524" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path></svg>
              <div class="faint" style="font-size: 12px">{{k.total}}</div>
            </div>
          </sc-for>
        </div>

        <div class="card" style="display: flex; flex-wrap: wrap; gap: 0">
          <sc-for list="{{rev}}" as="r" hint-placeholder-count="4">
            <div style="flex: 1 1 200px; padding: 4px 20px 4px 0; display: flex; flex-direction: column; gap: 6px">
              <div class="lbl">{{r.label}}</div>
              <div class="disp" style="font-size: 36px; font-weight: 600">{{r.value}}</div>
              <div style="display: flex; gap: 8px; align-items: center"><span class="{{r.d.cls}}">{{r.d.text}}</span><span class="faint" style="font-size: 12px">{{r.note}}</span></div>
            </div>
          </sc-for>
          <div class="faint" style="flex-basis: 100%; font-size: 12px; margin-top: 14px">Revenue estimated at {{revRate}} per install. Reps are paid on installs, so installs per rep is the headline metric.</div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
          <div class="card" style="flex: 2 1 520px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
              <div>
                <div class="disp ttl" style="font-size: 21px; font-weight: 700">Installs per rep, monthly</div>
                <div class="faint" style="font-size: 13px; margin-top: 2px">Last 24 months · shaded = current period</div>
              </div>
              <div style="display: flex; gap: 16px; font-size: 12px; color: #c3c8d1; flex-wrap: wrap">
                <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 18px; height: 3px; background: #f5a524; border-radius: 2px"></span>{{scopeShort}}</span>
                <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 18px; height: 0; border-top: 2px dashed #8a909c"></span>Company average</span>
              </div>
            </div>
            <div style="position: relative; height: 240px; margin-left: 36px">
              <sc-for list="{{trend.yt}}" as="t" hint-placeholder-count="4">
                <div style="position: absolute; left: 0; right: 0; top: {{t.top}}; border-top: 1px solid #1f242d"></div>
                <div style="position: absolute; left: -36px; top: {{t.top}}; transform: translateY(-50%); font-size: 11px; color: #858c99">{{t.label}}</div>
              </sc-for>
              <div style="position: absolute; top: 0; bottom: 0; left: {{trend.winLeft}}; width: {{trend.winW}}; background: rgba(245,184,61,.07); border-left: 1px dashed rgba(245,184,61,.4)"></div>
              <svg viewBox="0 0 1000 240" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible" aria-hidden="true">
                <path d="{{trend.co}}" fill="none" stroke="#8a909c" stroke-width="2" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"></path>
                <defs><linearGradient id="trendArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5a524" stop-opacity="0.28"></stop><stop offset="1" stop-color="#f5a524" stop-opacity="0"></stop></linearGradient></defs>
                <path d="{{trend.scArea}}" fill="url(#trendArea)"></path>
                <path class="glow" d="{{trend.sc}}" fill="none" stroke="#f5a524" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
              </svg>
              <div style="position: absolute; top: 0; bottom: 0; left: {{trend.hx}}; border-left: 1px solid #3a404c"></div>
              <div style="position: absolute; left: {{trend.hx}}; top: {{trend.hy}}; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #f5a524; box-shadow: 0 0 0 2px #0e1014, 0 0 12px rgba(245,165,36,.8)"></div>
              <div style="position: absolute; top: 6px; left: {{trend.hx}}; transform: {{trend.tipTx}}; background: #07080b; border: 1px solid #2a303b; border-radius: 10px; padding: 10px 12px; font-size: 12px; pointer-events: none; white-space: nowrap; z-index: 2; display: flex; flex-direction: column; gap: 4px">
                <div style="font-weight: 600">{{trend.tipMonth}}</div>
                <div style="display: flex; justify-content: space-between; gap: 16px"><span class="muted">{{scopeShort}}</span><span style="font-weight: 600">{{trend.tipS}}</span></div>
                <div style="display: flex; justify-content: space-between; gap: 16px"><span class="muted">Company</span><span>{{trend.tipC}}</span></div>
              </div>
              <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; z-index: 3" onMouseLeave="{{trend.leave}}">
                <sc-for list="{{trend.hits}}" as="h" hint-placeholder-count="24">
                  <div style="flex: 1; height: 100%" onMouseEnter="{{h.enter}}"></div>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; margin-left: 36px">
              <sc-for list="{{trend.xl}}" as="x" hint-placeholder-count="24">
                <div style="flex: 1; text-align: center; font-size: 11px; color: #858c99; white-space: nowrap">{{x.t}}</div>
              </sc-for>
            </div>
          </div>

          <div class="card" style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 16px">
            <div>
              <div class="disp ttl" style="font-size: 21px; font-weight: 700">Conversion funnel</div>
              <div class="faint" style="font-size: 13px; margin-top: 2px">Current period · change {{cmpShort}}</div>
            </div>
            <sc-for list="{{funnel.stages}}" as="s" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; gap: 8px">
                <sc-if value="{{s.hasConv}}" hint-placeholder-val="{{false}}">
                  <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; padding: 2px 0 2px 2px">
                    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1v7h8M8 5l3 3-3 3" fill="none" stroke="#858c99" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    <span class="muted">{{s.convLabel}}</span>
                    <strong>{{s.conv}}</strong>
                    <span class="{{s.d.cls}}">{{s.d.text}}</span>
                    <span class="faint" style="font-size: 12px">{{s.co}}</span>
                  </div>
                </sc-if>
                <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">{{s.name}}</span><span>{{s.count}}</span></div>
                <div style="height: 26px; background: #1a1e26; border-radius: 6px; overflow: hidden"><div class="glow" style="height: 100%; width: {{s.w}}; background: #f5a524; border-radius: 0 4px 4px 0"></div></div>
              </div>
            </sc-for>
            <div style="margin-top: auto; background: rgba(240,112,112,.08); border: 1px solid rgba(240,112,112,.3); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
              <span class="st crit"><i></i>Biggest drop-off: {{funnel.worst}}</span>
              <span style="font-size: 13px; line-height: 1.45; color: #d4d8df">{{funnel.worstNote}}</span>
            </div>
          </div>
        </div>

        <div class="card" style="display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: flex-end">
            <div>
              <div class="disp ttl" style="font-size: 21px; font-weight: 700">{{bd.title}}</div>
              <div class="faint" style="font-size: 13px; margin-top: 2px">{{bd.sub}}</div>
            </div>
            <div style="display: flex; gap: 14px; flex-wrap: wrap">
              <span class="st good"><i></i>On track</span><span class="st warn"><i></i>Watch</span><span class="st crit"><i></i>At risk</span>
            </div>
          </div>
          <div style="overflow-x: auto">
            <div class="trow head">
              <div>{{bd.dimLabel}}</div><div>Reps</div><div>SRAs / rep</div><div>CAPs / rep</div><div>Installs / rep</div><div>Recruits / rep</div><div>SRA → CAP</div><div>CAP → Inst</div><div>Req. training</div><div>Δ Inst / rep</div><div>Status</div>
            </div>
            <sc-for list="{{bd.rows}}" as="r" hint-placeholder-count="5">
              <div class="{{r.cls}}">
                <div><button type="button" class="rowbtn" onClick="{{r.go}}">{{r.name}}<span aria-hidden="true" style="color: #858c99">›</span></button></div>
                <div>{{r.reps}}</div><div>{{r.sra}}</div><div>{{r.cap}}</div><div style="font-weight: 600">{{r.ins}}</div><div>{{r.rec}}</div><div>{{r.c1}}</div><div>{{r.c2}}</div><div>{{r.tr}}</div>
                <div><span class="{{r.d.cls}}">{{r.d.text}}</span></div>
                <div><span class="{{r.stCls}}"><i></i>{{r.stLabel}}</span></div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <!-- ===================== 02 FUNNEL & RETENTION ===================== -->
    <sc-if value="{{isFunnel}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 20px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
          <sc-for list="{{convs}}" as="v" hint-placeholder-count="3">
            <div class="card" style="display: flex; flex-direction: column; gap: 10px">
              <div class="lbl">{{v.label}}</div>
              <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
                <span class="disp" style="font-size: 46px; font-weight: 600; line-height: 1">{{v.value}}</span>
                <span class="{{v.d.cls}}">{{v.d.text}}</span>
              </div>
              <div class="faint" style="font-size: 12px">Company {{v.co}} · {{v.gap}}</div>
              <svg viewBox="0 0 300 80" preserveAspectRatio="none" style="width: 100%; height: 80px; overflow: visible" aria-hidden="true">
                <path d="{{v.coPath}}" fill="none" stroke="#8a909c" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"></path>
                <path class="glow" d="{{v.scPath}}" fill="none" stroke="#f5a524" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
              </svg>
              <div style="display: flex; justify-content: space-between; font-size: 11px" class="faint"><span>Nov '24</span><span>Oct '26</span></div>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <div class="card" style="flex: 3 1 480px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px">
              <div>
                <div class="disp ttl" style="font-size: 21px; font-weight: 700">Recruit retention</div>
                <div class="faint" style="font-size: 13px; margin-top: 2px">Share of new reps still active after each milestone</div>
              </div>
              <div style="display: flex; gap: 16px; font-size: 12px; color: #c3c8d1; flex-wrap: wrap">

  status(dIns, c2, tr, tgt) {

  renderVals() {

    const pg = pages.find((x) => x.id === S.page);

    const ret = ['1 mo', '3 mo', '6 mo', '12 mo', '18 mo', '24 mo'].map((label, k) => {

    const rk = (f) => [this.wavg(ls, f), this.wavg(leaves, f)];
    const [ri, rci] = rk((l) => l.rook.ins), [rm, rcm] = rk((l) => l.rook.inc), [rr2, rcr] = rk((l) => l.rook.rec), [cb, ccb] = rk((l) => l.combine);
    const rookie = [
      { label: 'Rookie installs · first 90 days', value: ri.toFixed(1), d: this.chip((ri / rci - 1) * 100, '%'), co: 'Company ' + rci.toFixed(1) },

    ];

    // ---------- training page
    const reqDefs = [['RunXLearning (compliance)', 'runx'], ['Orientation', 'orient'], ['Playbooks', 'play'], ['Bootcamps', 'boot']];
    const req = reqDefs.map(([label, k]) => {
      const v = this.wavg(ls, (l) => l.tr[k]);
      const ok = v >= TGT;
      return { label, val: Math.round(v) + '%', w: v.toFixed(1) + '%', color: ok ? '#f5a524' : '#f07070', stCls: ok ? 'st good' : (v < TGT - 15 ? 'st crit' : 'st warn'), stLabel: ok ? 'On target' : 'Below target' };
    });
    const opt = [['Open rate', 'open', 'opened at least one'], ['Completion rate', 'comp', 'finished a module'], ['Rerun rate', 'rerun', 'watched 2x or more'], ['Progression', 'prog', 'avg. % of material done']].map(([label, k, desc]) => {
      const v = this.wavg(ls, (l) => l.tr[k]);

    });
    const reqAvg = this.wavg(ls, (l) => l.trReq);
    const share = this.wavg(ls, (l) => Math.min(1, Math.max(0, (l.trReq - 40) / 60)));
    const a6 = this.win(A, R(18, 24));
    const convT = a6.c3 * this.wavg(ls, (l) => l.tvu.cT), convU = a6.c3 * this.wavg(ls, (l) => l.tvu.cU);
    const dT = this.wavg(ls, (l) => l.tvu.dT), dU = this.wavg(ls, (l) => l.tvu.dU);
    const pT = c.insP * this.wavg(ls, (l) => l.tvu.pT), pU = c.insP * this.wavg(ls, (l) => l.tvu.pU);
    const tvu = [
      { label: 'Days to first deal', t: Math.round(dT), u: Math.round(dU), lift: Math.round(dU - dT) + ' days faster' },
      { label: 'SRA → Install, first 6 mo', t: this.pct(convT), u: this.pct(convU), lift: '+' + ((convT - convU) * 100).toFixed(1) + ' pts' },
      { label: 'Installs per rep / mo', t: pT.toFixed(2), u: pU.toFixed(2), lift: '+' + Math.round((pT / pU - 1) * 100) + '%' }
    ];
    const untrainedReps = c.avgReps * (1 - share);

    const tvuNote = 'About ' + Math.round(untrainedReps) + ' active reps in ' + scopeShort + ' haven’t finished required training. Bringing them to the trained average is worth roughly +' + this.int(tvuGain) + ' installs (' + this.money(tvuGain * REV) + ') per quarter.';
    const prog = this.wavg(ls, (l) => l.tr.prog);
    const liftScore = Math.max(0, Math.min(100, 40 + (convT - convU) * 100 * 3));
    const score = Math.round(0.4 * reqAvg + 0.2 * prog + 0.4 * liftScore);
    const eff = {
      score, w: score + '%', dash: (score / 100 * 351.86).toFixed(1) + ' 351.86', aria: 'Training effectiveness score ' + score + ' of 100',
      band: score >= 80 ? 'Strong' : (score >= 65 ? 'Moderate' : 'Weak'),
      stCls: score >= 80 ? 'st good' : (score >= 65 ? 'st warn' : 'st crit'),
      parts: [
        { label: 'Required completion', wt: '40%', v: Math.round(reqAvg) },
        { label: 'Optional progression', wt: '20%', v: Math.round(prog) },
        { label: 'Conversion lift, trained vs. not', wt: '40%', v: Math.round(liftScore) }
      ]
    };
    const compl = groups.filter((g) => g.ls.length).map((g) => {
      const v = this.wavg(g.ls, (l) => l.trReq);
      const ok = v >= TGT;
      return { name: g.name, go: g.go, v, val: Math.round(v) + '%', w: v.toFixed(1) + '%', color: ok ? '#f5a524' : '#f07070', stCls: ok ? 'st good' : (v < TGT - 15 ? 'st crit' : 'st warn'), stLabel: ok ? 'Compliant' : 'Get compliant' };
    }).sort((x, y) => x.v - y.v);

    // ---------- content performance (course > module > video)
    const { COURSES, UNIT } = this.data();
    const STL = { all: 'SRA → Install', ramp: 'Days to 1st SRA', sra: 'SRAs per rep', c1: 'SRA → CAP', c2: 'CAP → Install', rec: 'Recruits per rep' };
    const compBase = this.wavg(ls, (l) => l.tr.comp);
    const pf = prog / this.wavg(leaves, (l) => l.tr.prog);
    const lscore = (lift, u) => Math.max(0, Math.min(100, 40 + lift * (u === 'pts' ? 8 : (u === 'days' ? 10 : 2.5))));
    const fmtLift = (lift, u) => u === 'days' ? lift.toFixed(1) + ' days faster' : '+' + lift.toFixed(1) + (u === 'pts' ? ' pts' : '%');
    const dur = (m) => m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min';
    const mean = (arr, f) => arr.reduce((s, x) => s + f(x), 0) / arr.length;
    const statusOf = (it) => {
      if (it.req && it.comp < TGT - 15) return { cls: 'st crit', label: 'Low completion' };
      if (it.ls >= 75 && it.comp < (it.req ? TGT - 10 : 60)) return { cls: 'st warn', label: 'Under-watched' };

      if (it.req && it.comp < TGT - 5) return { cls: it.comp < TGT - 15 ? 'st crit' : 'st warn', label: 'Low completion' };

    };
    const finish = (it) => {

    };

    });
    const allM = [].concat(...cItems.map((x) => x.mItems)), allV = [].concat(...allM.map((x) => x.vItems));
    const lvl = S.tLevel, tc = S.tCourse, tm = S.tModule;
    let citems = lvl === 'course' ? cItems : (lvl === 'module' ? allM.filter((m) => !tc || m.cid === tc) : allV.filter((v) => (!tc || v.cid === tc) && (!tm || v.mid === tm)));
    if (S.tSort === 'score') citems = citems.slice().sort((a, b) => a.score - b.score);

    const contentsOf = (it) => it.kind === 'course' ? it.n + ' modules · ' + it.nv + ' videos · ' + dur(it.min) : (it.kind === 'module' ? it.n + ' videos · ' + dur(it.min) : dur(it.min));
    const showPath = (lvl === 'module' && !tc) || (lvl === 'video' && !tm);
    const ctRows = citems.map((it) => ({

        : (it.kind === 'module' ? () => this.setState({ tLevel: 'video', tCourse: it.cid, tModule: it.id, tSel: it.id }) : () => this.setState({ tSel: it.id }))
    }));
    const crs = tc && cItems.find((x) => x.id === tc), mdl = tm && allM.find((x) => x.id === tm);
    const crumbs = [{ name: 'All courses', sep: false, link: lvl !== 'course', here: lvl === 'course', go: () => this.setState({ tLevel: 'course', tCourse: null, tModule: null, tSel: null }) }];
    if (crs) crumbs.push({ name: crs.name, sep: true, link: !!mdl || lvl === 'video', here: !mdl && lvl !== 'video', go: () => this.setState({ tLevel: 'module', tCourse: crs.id, tModule: null, tSel: crs.id }) });
    if (mdl) crumbs.push({ name: mdl.name, sep: true, link: false, here: true, go: null });
    else if (!crs && lvl !== 'course') crumbs.push({ name: lvl === 'module' ? 'All modules' : 'All videos', sep: true, link: false, here: true, go: null });
    else if (crs && lvl === 'video') crumbs.push({ name: 'All videos', sep: true, link: false, here: true, go: null });
    const findC = (id) => cItems.find((x) => x.id === id) || allM.find((x) => x.id === id) || allV.find((x) => x.id === id);
    const fo = (S.tSel && findC(S.tSel)) || citems[0];
    const outstanding = Math.round(c.avgReps * (1 - fo.comp / 100));
    const sl = fo.st.label;
    let insight;
    if (sl === 'Under-watched') insight = 'High-impact content that too few reps finish: only ' + Math.round(fo.comp) + '% have completed it, and those who do show ' + fmtLift(fo.lift, fo.u) + ' on ' + STL[fo.stage] + '. Push it to the ~' + outstanding + ' reps who haven’t' + (fo.req ? '.' : ', or make it required.');
    else if (sl === 'Low completion') insight = 'Required, but only ' + Math.round(fo.comp) + '% complete (~' + outstanding + ' reps outstanding). Get completion up before judging its impact.';
    else if (sl === 'Low impact') insight = 'Well watched (' + Math.round(fo.comp) + '% complete) but little measurable lift on ' + STL[fo.stage] + '. Review or refresh the content, or link it to a different metric.';
    else if (sl === 'Drop-off') insight = 'Reps watch only ' + Math.round(fo.prog) + '% on average. Shorten it or split it into smaller pieces' + (fo.kind === 'video' ? '; the retention curve shows where they leave.' : '.');
    else insight = 'Completed widely and tied to ' + fmtLift(fo.lift, fo.u) + ' on ' + STL[fo.stage] + '. Keep it' + (fo.req ? ' and reuse it in field training.' : '; consider making it required.');
    let curve = '', curveArea = '', dropNote = '', curveAria = '';
    if (fo.kind === 'video') {
      const e = Math.max(0.2, 1 - 1.8 * (1 - fo.prog / 100));
      const pts = [];
      for (let k = 0; k <= 10; k++) { let y = 1 - (1 - e) * Math.pow(k / 10, 0.8); if (fo.src.dip && k >= 4) y -= 0.1; pts.push(Math.max(0.05, y)); }
      curve = this.path(pts, 300, 80, 0, 1, false);
      curveArea = curve + ' L300 80 L0 80 Z';
      let bi = 1, bd2 = 0;
      for (let k = 1; k <= 10; k++) { const dd = pts[k - 1] - pts[k]; if (dd > bd2) { bd2 = dd; bi = k; } }
      dropNote = 'Steepest drop near ' + bi * 10 + '% · ' + Math.round(pts[10] * 100) + '% reach the end';
      curveAria = 'Audience retention falls from 100% to ' + Math.round(pts[10] * 100) + '%, steepest near ' + bi * 10 + '% of the video';
    }
    const fbar = (label, v) => ({ label, val: Math.round(v) + '%', w: v.toFixed(1) + '%' });
    const ct = {
      levels: [['course', 'Courses'], ['module', 'Modules'], ['video', 'Videos']].map(([k, label]) => ({
        label, on: lvl === k, cls: lvl === k ? 'on' : '',
        go: () => this.setState(k === 'course' ? { tLevel: k, tCourse: null, tModule: null } : (k === 'module' ? { tLevel: k, tModule: null } : { tLevel: k }))
      })),
      sorts: [['order', 'Catalog'], ['score', 'Lowest score'], ['comp', 'Lowest completion']].map(([k, label]) => ({ label, on: S.tSort === k, cls: S.tSort === k ? 'on' : '', go: () => this.setState({ tSort: k }) })),
      crumbs, levelName: { course: 'Course', module: 'Module', video: 'Video' }[lvl], rows: ctRows,
      d: {
        kind: { course: 'Course', module: 'Module · ' + (fo.path || ''), video: 'Video · ' + (fo.path || '') }[fo.kind],
        name: fo.name, type: fo.req ? 'Required' : 'Optional', typeCls: fo.req ? 'chip req' : 'chip flat', contents: contentsOf(fo),
        score: fo.score, stCls: fo.st.cls, stLabel: sl,
        funnel: [fbar(fo.req ? 'Assigned' : 'Eligible', 100), fbar('Started', fo.started), fbar('Completed', fo.comp), fbar('Rewatched 2x+', fo.rerun)],
        isVideo: fo.kind === 'video', curve, curveArea, dropNote, curveAria,
        liftNote: 'Reps who completed it ' + (fo.u === 'days' ? 'reach their first SRA ' + fo.lift.toFixed(1) + ' days faster' : 'show ' + fmtLift(fo.lift, fo.u) + ' on ' + STL[fo.stage]) + ' than reps who haven’t. Average watched: ' + Math.round(fo.prog) + '%.',
        insight
      }
    };

    // ---------- areas to improve
    const Q = [21, 22, 23], PQ = [18, 19, 20];
    const med = (arr) => { const s = arr.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
    const bench = {};
    CH.forEach((x) => {
      const w = leaves.filter((l) => l.ch === x.id).map((l) => this.win(l.m, Q));
      bench[x.id] = { c1: med(w.map((s) => s.c1)), c2: med(w.map((s) => s.c2)) };

    const coRet6 = this.wavg(leaves, (l) => l.ret[2]);
    const leafComp = (l, cr, v) => Math.max(3, Math.min(100, (cr.req ? l.tr[cr.trk] : l.tr.comp + cr.adj) + v.off));
    const STK = { c2: 'c2', c1: 'c1', vol: 'sra', ret: 'rec' };
    const prescribe = (l, k, trGap) => {
      const picks = [];
      if (trGap || k === 'tr') {
        COURSES.filter((cr) => cr.req).forEach((cr) => cr.mods.forEach((md) => {
          const comp = mean(md.vids, (v) => leafComp(l, cr, v));
          picks.push({ kind: 'Module', cr, md, id: md.id, name: md.name, comp, liftTxt: 'Required · ' + dur(md.vids.reduce((s, v) => s + v.min, 0)), rank: comp });
        }));
      } else {
        COURSES.filter((cr) => cr.stage === STK[k]).forEach((cr) => cr.mods.forEach((md) => md.vids.forEach((v) => {
          const comp = leafComp(l, cr, v), u = UNIT[cr.stage];
          picks.push({ kind: 'Video', cr, md, id: v.id, name: v.name, comp, liftTxt: fmtLift(v.lift, u) + ' on ' + STL[cr.stage], rank: -lscore(v.lift, u) * (1.15 - comp / 100) });
        })));
      }
      picks.sort((a, b) => a.rank - b.rank);
      return picks.slice(0, 3).map((x) => {
        const n = Math.max(1, Math.round(l.reps * (1 - x.comp / 100)));
        return {
          type: x.kind, typeCls: x.cr.req ? 'chip req' : 'chip flat', name: x.name,
          path: x.kind === 'Video' ? x.cr.name + ' › ' + x.md.name : x.cr.name,
          comp: Math.round(x.comp) + '% complete here', lift: x.liftTxt, n, need: n + ' of ' + l.reps + ' reps still need it',
          go: () => this.setState({ page: 'training', channel: l.ch, region: l.rg, office: l.of, tLevel: x.kind === 'Video' ? 'video' : 'module', tCourse: x.cr.id, tModule: x.kind === 'Video' ? x.md.id : null, tSel: x.id })
        };

    };
    const assigned = S.assigned || {};
    const flagsAll = [];
    ls.forEach((l) => {
      const q = this.win(l.m, Q), pq = this.win(l.m, PQ), b = bench[l.ch];
      const cands = [];
      const g2 = b.c2 - q.c2, d2 = q.c2 - pq.c2;
      if (g2 > 0.035 || d2 < -0.03) cands.push({ k: 'c2', up: Math.max(g2, -d2) * q.cap, issue: 'CAP → Install at ' + this.pct(q.c2) + ' (' + (d2 < 0 ? '−' : '+') + Math.abs(d2 * 100).toFixed(1) + ' pts QoQ; ' + l.chName + ' benchmark ' + this.pct(b.c2) + ')', bench: this.pct(b.c2), stage: 'CAP → Install' });
      const g1 = b.c1 - q.c1, d1 = q.c1 - pq.c1;
      if (g1 > 0.035 || d1 < -0.03) cands.push({ k: 'c1', up: Math.max(g1, -d1) * q.sra * q.c2, issue: 'SRA → CAP at ' + this.pct(q.c1) + ' (' + (d1 < 0 ? '−' : '+') + Math.abs(d1 * 100).toFixed(1) + ' pts QoQ; ' + l.chName + ' benchmark ' + this.pct(b.c1) + ')', bench: this.pct(b.c1), stage: 'SRA → CAP' });
      const dS = q.sraP / pq.sraP - 1;
      if (dS < -0.08) cands.push({ k: 'vol', up: (pq.sraP - q.sraP) * q.reps * q.c3, issue: 'SRAs per rep down ' + Math.abs(dS * 100).toFixed(1) + '% QoQ (' + q.sraP.toFixed(2) + ' vs. ' + pq.sraP.toFixed(2) + ')', prev: pq.sraP.toFixed(2) });
      const rg6 = coRet6 - l.ret[2];
      if (rg6 > 0.07) cands.push({ k: 'ret', up: rg6 * l.reps * q.insP * 3 * 0.5, issue: '6-month recruit retention ' + Math.round(l.ret[2] * 100) + '% vs. company ' + Math.round(coRet6 * 100) + '%' });
      const trGap = l.trReq < TGT - 5;
      if (!cands.length && trGap) cands.push({ k: 'tr', up: 0.04 * q.ins, issue: 'Required training ' + Math.round(l.trReq) + '% complete' });
      if (!cands.length) return;
      cands.sort((x, y) => y.up - x.up);
      const t = cands[0];
      if (t.up < 4 && !trGap) return;
      let action, diag, diagCls, pitch;
      const where = l.ofName + ' ' + l.chName;
      if (trGap) {
        diag = 'Compliance gap · ' + Math.round(l.trReq) + '% required training';
        diagCls = 'chip down';
        action = 'Get every rep through RunXLearning, orientation and playbooks first. Re-check conversions after 30 days before prescribing skill training.';
      } else {
        diag = 'Training complete · skill gap';
        diagCls = 'chip flat';
        const big = (t.k === 'c2' && (b.c2 - q.c2) > 0.05) || (t.k === 'c1' && (b.c1 - q.c1) > 0.05);
        const mod = { c2: 'Targeted CAP → Install module (install-day prep, cancellation saves, customer follow-through)', c1: 'Targeted SRA → CAP module (clean paperwork, site-survey readiness, permitting docs)', vol: 'Prospecting bootcamp plus daily activity tracking with the office leader', ret: 'Leader coaching on rookie onboarding, combine draft and first-30-day check-ins', tr: 'Close out remaining required modules' }[t.k];
        action = mod + (big ? '. Gap is large: schedule in-person field training.' : '.');
      }

        stCls: sev ? 'st crit' : 'st warn', stLabel: sev ? 'At risk' : 'Watch', trGap,
        go: () => this.setState({ page: 'overview', channel: l.ch, region: l.rg, office: l.of })
      });
    });
    flagsAll.sort((x, y) => y.up - x.up);
    const flags = flagsAll.slice(0, 8).map((f, i) => Object.assign({}, f, { rank: i + 1 }));
    const totUp = flagsAll.reduce((s, f) => s + f.up, 0);
    const heat = RG.map((g) => ({
      name: g.name,
      cells: CH.map((x) => {
        const sub = leaves.filter((l) => l.ch === x.id && l.rg === g.id);
        const a = this.agg(sub), hc = this.win(a, M.cur), hp = this.win(a, M.prev);
        const v = (hc.insP / hp.insP - 1) * 100;
        const t = Math.max(-1, Math.min(1, v / 10));

        const on = (ch === x.id) && (rg === g.id);

          text: (v > 0 ? '+' : (v < 0 ? '−' : '')) + Math.abs(v).toFixed(1) + '%', bg, fg: dark ? '#07080b' : '#eceef2',
          ring: on ? 'inset 0 0 0 2px #f5a524' : 'none',
          aria: x.name + ', ' + g.name + ': installs per rep ' + (v >= 0 ? 'up ' : 'down ') + Math.abs(v).toFixed(1) + ' percent',
          go: () => this.setState({ page: 'overview', channel: x.id, region: g.id, office: 'all' })
        };
      })
    }));
    const imp = {
      tiles: [
        { label: 'Offices flagged', value: String(flagsAll.length), note: 'Office × channel combinations in ' + scopeShort },
        { label: 'Training compliance gaps', value: String(flagsAll.filter((f) => f.trGap).length), note: 'Fix first: below ' + (TGT - 5) + '% required training' },
        { label: 'Skill gaps', value: String(flagsAll.filter((f) => !f.trGap).length), note: 'Trained, but a funnel stage is slipping' },
        { label: 'Revenue at stake', value: this.money(totUp * REV), note: '+' + this.int(totUp) + ' installs per quarter if gaps close' }
      ],
      cols: CH.map((x) => ({ name: x.name })), heat, flags,
      more: flagsAll.length > 8 ? 'Showing top 8 of ' + flagsAll.length + '.' : ''
    };

    // ---------- follow-through on assigned training
    const KIND = { c2: { label: 'CAP → Install', pct: true }, c1: { label: 'SRA → CAP', pct: true }, vol: { label: 'SRAs per rep / mo', pct: false }, ret: { label: '6-mo recruit retention', pct: true }, tr: { label: 'Required training complete', pct: true } };
    const fmtK = (k, v) => KIND[k].pct ? (v * 100).toFixed(1) + '%' : v.toFixed(2);
    const fmtD = (k, d) => (d >= 0 ? '+' : '−') + (KIND[k].pct ? Math.abs(d * 100).toFixed(1) + ' pts' : Math.abs(d).toFixed(2));
    const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const dateOf = (off) => { const dt = new Date(2026, 9, 28 + off); return MN[dt.getMonth()] + ' ' + dt.getDate(); };
    const noise = (w, i) => { const x = Math.sin(w * 12.9898 + i * 78.233) * 43758.5453; return x - Math.floor(x) - 0.5; };
    const smooth = (x) => x * x * (3 - 2 * x);
    const SEEDS = [
      { ch: 'street', rg: 'sw', of: 'phoenix', k: 'vol', days: 92, comp: 0.94, base: 2.62, target: 3.0, eff: 1.05, items: ['The First 10 Seconds', 'Handling “Not Interested”', 'Reading a Utility Bill'] },
      { ch: 'retail', rg: 'tx', of: 'dallas', k: 'c2', days: 75, comp: 0.88, base: 0.812, target: 0.861, eff: 0.7, items: ['Saving a Cancel', 'The Pre-Install Call', 'Setting Timeline Expectations'] },
      { ch: 'chain', rg: 'se', of: 'tampa', k: 'c1', days: 64, comp: 0.52, base: 0.742, target: 0.79, eff: 0.15, items: ['Clean SRA Checklist', 'Common CAP Rejections', 'Photo Requirements'] },
      { ch: 'block', rg: 'ca', of: 'sd', k: 'ret', days: 41, comp: 0.81, base: 0.58, target: 0.7, eff: 0.5, items: ['Onboarding Rookies', 'Running a Combine', 'Telling Your Story'] },
      { ch: 'air', rg: 'ne', of: 'boston', k: 'c2', days: 33, comp: 0.9, base: 0.8, target: 0.85, eff: 0.05, items: ['Saving a Cancel', 'Prepping the Homeowner', 'What Happens After the SRA'] },
      { ch: 'retail', rg: 'sw', of: 'vegas', k: 'tr', days: 18, comp: 0.64, base: 0.78, target: 0.9, eff: 0.55, items: ['Code of Conduct & Ethics', 'Licensing & State Rules', 'Product Basics'] }
    ];
    const sess = Object.keys(assigned).map((key) => assigned[key]).sort((x, y) => y.at - x.at);
    const volOf = (l, k) => { const q = this.win(l.m, Q); return { c2: q.cap, c1: q.sra * q.c2, vol: q.reps * q.c3, ret: l.reps * q.insP * 1.5, tr: 0 }[k]; };
    const fuAll = sess.concat(SEEDS).filter(inScope).map((a, i) => {
      const l = leaves.find((x) => x.ch === a.ch && x.of === a.of);
      const reps = a.reps || l.reps;
      const gap = a.target - a.base;
      const val = (d) => d < 0 ? a.base + gap * 0.45 * (-d / 84) + gap * 0.12 * noise(d, i) : a.base + gap * a.eff * smooth(Math.min(1, d / 60)) + (d > 0 ? gap * 0.08 * noise(d, i) : 0);
      const pts = [];
      for (let w = -12; w * 7 <= a.days; w++) pts.push([w, val(w * 7)]);
      if (a.days % 7) pts.push([a.days / 7, val(a.days)]);
      const now = val(a.days), g = gap ? (now - a.base) / gap : 0;
      const ys = pts.map((x) => x[1]).concat([a.base, a.target]);
      let lo = Math.min(...ys), hi = Math.max(...ys);
      const pad = (hi - lo) * 0.18 || 0.01; lo -= pad; hi += pad;
      const Yp = (v) => (1 - (v - lo) / (hi - lo)) * 100;
      const line = 'M' + pts.map(([w, v]) => ((w + 12) * 10).toFixed(1) + ' ' + (Yp(v) * 0.7).toFixed(1)).join(' L');
      let st, action;
      if (a.days < 30 && a.comp >= 0.6) { st = { cls: 'st info', label: a.days ? 'In progress' : 'Just assigned' }; action = a.days ? 'Too early to judge. First checkpoint on ' + dateOf(30 - a.days) + '.' : 'Baseline captured today. Reps get a reminder at day 7; first checkpoint on ' + dateOf(30) + '.'; }
      else if (a.comp < 0.6) { st = { cls: a.days ? 'st warn' : 'st info', label: a.days ? 'Completion lagging' : 'Just assigned' }; action = a.days ? Math.round((1 - a.comp) * reps) + ' reps haven’t finished. Ask the office leader to block time in the next team meeting before judging results.' : 'Baseline captured today. Reps get a reminder at day 7; first checkpoint on ' + dateOf(30) + '.'; }
      else if (g >= 0.8) { st = { cls: 'st good', label: 'Recovered' }; action = 'Back at target. Close the assignment and reuse this playbook for similar offices.'; }
      else if (g >= 0.3) { st = { cls: 'st good', label: 'Improving' }; action = Math.round(g * 100) + '% of the gap closed. Keep the leader check-ins going through day 90.'; }
      else { st = { cls: 'st crit', label: 'No lift · escalate' }; action = 'Training is complete but the metric hasn’t moved. Schedule in-person field training and review whether this content fits the problem.'; }
      const gained = Math.max(0, now - a.base) * volOf(l, a.k);
      return {
        title: l.ofName, meta: l.rgName + ' · ' + l.chName, metric: KIND[a.k].label,
        targetText: 'Baseline ' + fmtK(a.k, a.base) + ' → target ' + fmtK(a.k, a.target),
        items: a.items.map((n) => ({ name: n })),
        compW: Math.round(a.comp * 100) + '%', compText: Math.round(a.comp * reps) + ' of ' + reps + ' reps finished · ' + Math.round(a.comp * 100) + '%',
        when: 'Assigned ' + dateOf(-a.days) + (a.days ? ' · day ' + a.days : ' · today'),
        nowText: fmtK(a.k, now), nowD: a.days ? this.chip((now - a.base) * (KIND[a.k].pct ? 100 : 1 / a.base * 100), KIND[a.k].pct ? ' pts' : '%') : { cls: 'chip flat', text: 'baseline' },
        line, baseTop: Yp(a.base).toFixed(1) + '%', tgtTop: Yp(a.target).toFixed(1) + '%',

        cps: [30, 60, 90].map((cp) => {

            closed: done ? Math.round((v - a.base) / gap * 100) + '% of gap closed' : '',
            due: done ? '' : 'Due ' + dateOf(cp - a.days) + ' · in ' + (cp - a.days) + ' days'

    });

    const gainedTot = fuAll.reduce((s, r) => s + r.gained, 0);
    const fu = {
      rows: fuAll, empty: fuAll.length === 0,

        { label: 'Avg. completion', value: active.length ? Math.round(active.reduce((s, r) => s + r.comp, 0) / active.length * 100) + '%' : '—', note: 'Share of assigned reps who finished every item' },

      ],
      evidence: [bar('Finished ≥80% of assigned training', gHi), bar('Finished under 80%', gLo)],
      evidenceNote: gHi != null && gLo != null ? 'Offices that finished their assigned training closed ' + Math.round(gHi * 100) + '% of their gap on average, vs. ' + Math.round(gLo * 100) + '% for offices that didn’t. Completion is the first lever; if it’s high and nothing moved, escalate to field training.' : 'Not enough assignments past day 30 in this scope to compare yet.',
      goImprove: () => this.setState({ page: 'improve' })

    return {
      navs: pages.map((x, i) => ({
        label: x.label, num: '0' + (i + 1), cls: 'nav' + (S.page === x.id ? ' on' : ''), current: S.page === x.id ? 'page' : 'false',
        go: () => this.setState({ page: x.id }),
        hasBadge: (x.id === 'improve' && flagsAll.length > 0) || (x.id === 'follow' && active.length > 0),
        badge: String(x.id === 'follow' ? active.length : flagsAll.length)
      })),
      fu, isFollow: S.page === 'follow',
      modes: ['MoM', 'QoQ', 'YoY'].map((k) => ({ label: k, on: S.mode === k, cls: S.mode === k ? 'on' : '', go: () => this.setState({ mode: k, hov: null }) })),
      chanPills: [{ id: 'all', name: 'All channels' }].concat(CH).map((x) => ({ name: x.name, on: ch === x.id, cls: 'pill' + (ch === x.id ? ' on' : ''), go: () => this.setState({ channel: x.id }) })),
      regPills: [{ id: 'all', name: 'All regions' }].concat(RG).map((x) => ({ name: x.name, on: rg === x.id, cls: 'pill' + (rg === x.id ? ' on' : ''), go: () => this.setState({ region: x.id, office: 'all' }) })),
      offPills: rgObj ? [{ id: 'all', name: 'All offices' }].concat(rgObj.offices).map((x) => ({ name: x.name, on: of === x.id, cls: 'pill' + (of === x.id ? ' on' : ''), go: () => this.setState({ office: x.id }) })) : [],
      showOffices: !!rgObj, isScoped: ch !== 'all' || rg !== 'all',
      reset: () => this.setState({ channel: 'all', region: 'all', office: 'all' }),
      pageKicker: pg.kicker, pageTitle: pg.title, scopeName, scopeShort, periodLabel: M.lab, cmpShort: M.short,
      isOverview: S.page === 'overview', isFunnel: S.page === 'funnel', isTraining: S.page === 'training', isImprove: S.page === 'improve',
      kpis, rev, revRate: this.money(REV), trend, funnel,
      hero: {
        value: c.insP.toFixed(2), d: this.chip((c.insP / p.insP - 1) * 100, '%'), co: cc.insP.toFixed(2),
        rev: this.money(c.ins * REV), risk: this.money(totUp * REV) + ' / qtr',
        cta: 'See where to focus · ' + flagsAll.length + ' flagged', go: () => this.setState({ page: 'improve' })
      },
      bd: { title: bdTitle, sub: 'Current period, change ' + M.short + '. Select a name to drill in.', dimLabel: dim, dimLower: dim.toLowerCase(), rows },
      convs, ret, speed, rookie,
      req, opt, tvu, tvuNote, eff, compl, tgt: TGT, tgtPos: TGT + '%', trShare: Math.round(share * 100) + '%', ct,
      imp
    };
  }
}

mount = document.getElementById('app');
comp = new Component({});
draw();
